<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClauseChecker Sign In</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #f8fafc;
        }

        .card {
            background-color: rgba(255, 193, 7, 0.08);
            border: 1px solid #2a2e3d;
            padding: 2.5rem;
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: #ffc107;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 1.75rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
            position: relative;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: #12141c;
            border: 1px solid #2a2e3d;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
        }

        input:focus {
            outline: none;
            border-color: #ffc107;
        }

        .password-container {
            position: relative;
        }

        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            font-size: 1rem;
            background: none;
            border: none;
        }

        .forgot-link {
            display: block;
            text-align: right;
            font-size: 0.85rem;
            color: #ffc107;
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        button[type="submit"] {
            width: 100%;
            padding: 0.75rem;
            background-color: #ffc107;
            color: #12141c;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button[type="submit"]:hover {
            animation: ease-in-out;
            scale: 1.1;
            background-color: #e0a800;
        }

        .footer-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .footer-text a {
            color: #ffc107;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }

        .error-alert {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #f87171;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="brand">ClauseChecker</div>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to check your documents for risky clauses.</p>

        <div id="errorAlert" class="error-alert"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="you@example.com" required />
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="password-container">
                    <input type="password" id="password" placeholder="••••••••" required />
                    <span id="togglePassword" class="password-toggle-btn"
                        style="cursor: pointer; font-size: 12px; font-weight: bold; color: #ffc107;">SHOW</span>
                </div>
            </div>
            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
            <button type="submit">Sign In</button>
        </form>

        <div class="footer-text">
            Don't have an account? <a href="signup.html">Sign up</a>
        </div>
    </div>

    <script>
        // Password visibility toggle
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            togglePassword.textContent = isPassword ? 'HIDE' : 'SHOW';
        });

        // Login Form Submission
        const loginForm = document.getElementById('loginForm');
        const errorAlert = document.getElementById('errorAlert');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorAlert.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            const password = passwordInput.value;

            try {
                const res = await fetch('http://localhost:5000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', data.user.username);
                    window.location.href = 'index.html';
                } else {
                    errorAlert.textContent = data.error || 'Invalid credentials.';
                    errorAlert.style.display = 'block';
                }
            } catch (err) {
                errorAlert.textContent = 'Server connection failed.';
                errorAlert.style.display = 'block';
            }
        });
    </script>

</body>

</html>
