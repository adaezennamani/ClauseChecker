<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClauseChecker - Password Reset</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #f8fafc;
        }

        .card {
            background-color: rgba(255, 193, 7, 0.08);
            border: 1px solid #2a2e3d;
            padding: 2.5rem;
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .back-link {
            display: inline-block;
            font-size: 0.85rem;
            color: #94a3b8;
            text-decoration: none;
            margin-bottom: 1.5rem;
        }

        .back-link:hover {
            color: #ffc107;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 1.75rem;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: #12141c;
            border: 1px solid #2a2e3d;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
        }

        input:focus {
            outline: none;
            border-color: #ffc107;
        }

        button[type="submit"] {
            width: 100%;
            padding: 0.75rem;
            background-color: #ffc107;
            color: #12141c;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button[type="submit"]:hover {
            animation: ease-in-out;
            scale: 1.1;
            background-color: #e0a800;
        }

        .alert {
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .error-alert {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #f87171;
        }

        .success-alert {
            background-color: rgba(34, 197, 94, 0.1);
            border: 1px solid #22c55e;
            color: #4ade80;
        }
    </style>
</head>

<body>

    <div class="card">
        <a href="login.html" class="back-link">&larr; Back to sign in</a>
        <h1>Reset your password</h1>
        <p class="subtitle">Enter the email associated with your account and we'll send you a link to reset your
            password.</p>

        <div id="errorAlert" class="alert error-alert"></div>
        <div id="successAlert" class="alert success-alert"></div>

        <form id="forgotForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="you@example.com" required />
            </div>
            <button type="submit">Send Reset Link</button>
        </form>
    </div>

    <script>
        const forgotForm = document.getElementById('forgotForm');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');

        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorAlert.style.display = 'none';
            successAlert.style.display = 'none';

            const email = document.getElementById('email').value.trim();

            try {
                const res = await fetch('http://localhost:5000/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (res.ok) {
                    successAlert.textContent = data.message || 'Reset link sent! Check your inbox.';
                    successAlert.style.display = 'block';
                    forgotForm.reset();
                } else {
                    errorAlert.textContent = data.error || 'Something went wrong.';
                    errorAlert.style.display = 'block';
                }
            } catch (err) {
                errorAlert.textContent = 'Server connection failed.';
                errorAlert.style.display = 'block';
            }
        });
    </script>

</body>

</html>
